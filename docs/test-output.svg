  <rect x="70" y="56" width="1260" height="968" rx="24" fill="#111827" stroke="#273449" stroke-width="2"/>
  <text x="120" y="128" fill="#f8fafc" font-family="Arial, sans-serif" font-size="40" font-weight="700">NFT Bazar Test Output</text>
  <text x="120" y="168" fill="#94a3b8" font-family="Arial, sans-serif" font-size="22">Local verification recorded on 2026-07-31</text>
  <rect x="1020" y="104" width="250" height="54" rx="27" fill="#14532d"/>
  <text x="1050" y="140" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="20" font-weight="700">ALL TESTS PASSED</text>

  <rect x="120" y="220" width="570" height="130" rx="14" fill="#172033" stroke="#2a3a55"/>
