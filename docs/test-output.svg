  <rect x="120" y="388" width="1160" height="566" rx="14" fill="#020617" stroke="#2a3a55"/>
  <rect x="120" y="388" width="1160" height="58" rx="14" fill="#0f172a"/>
  <rect x="120" y="430" width="1160" height="16" fill="#0f172a"/>
  <text x="150" y="425" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">Verified test run</text>

  <g font-family="Cascadia Code, Consolas, monospace" font-size="20">
    <text x="160" y="492" fill="#93c5fd">$ cargo test --workspace</text>
    <text x="160" y="532" fill="#d1fae5">marketplace: seller_can_create_and_cancel_a_listing ... ok</text>
    <text x="160" y="566" fill="#d1fae5">nft_collection: initialization_exposes_collection_metadata ... ok</text>
    <text x="160" y="600" fill="#d1fae5">nft_collection: mint_records_owner_and_metadata_uri ... ok</text>
    <text x="160" y="634" fill="#d1fae5">nft_collection: transfer_changes_the_recorded_owner ... ok</text>
    <text x="160" y="668" fill="#d1fae5">royalty_pool: initialization_rejects_an_incomplete_royalty_split ... ok</text>
    <text x="160" y="702" fill="#d1fae5">royalty_pool: initialization_accepts_a_complete_royalty_split ... ok</text>
    <text x="160" y="742" fill="#86efac">Contract result: 6 passed; 0 failed</text>
