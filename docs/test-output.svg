<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title description">
  <title id="title">NFT Bazar automated test output</title>
  <desc id="description">Terminal-style evidence showing six passing Soroban contract tests and four passing frontend utility tests.</desc>
